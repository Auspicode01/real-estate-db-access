spring:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: "classpath:test/db/migration/V1_1__test_db_init.sql"
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none

logging:
  level:
    org:
      hibernate:
        sql: info